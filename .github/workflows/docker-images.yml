name: Docker images

# Publishes the matching MindWire runtime and console images to GHCR:
#   ghcr.io/<owner>/mindwire-runtime
#   ghcr.io/<owner>/mindwire-console
#
# Release invokes this reusable workflow only after the checked daemon binaries are attached to the
# GitHub Release. A manual dispatch can test images under an explicit tag without cutting a release.
#
# Triggers:
#   • workflow_call    → release: semver tags + :latest (RC tags skip :latest).
#   • workflow_dispatch → manual test: explicit tag (or short SHA), never moves :latest.
#
# Multi-arch is built NATIVELY (amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm) rather than under QEMU
# emulation — the console build is bun-heavy (bun install + vite + tsup) and emulated arm64 would crawl.
# Each arch is pushed BY DIGEST under no tag; `merge` then assembles the tagged manifest list. If the
# arm64 runner is ever unavailable, drop the arm64 matrix row (amd64-only) as a temporary fallback.

on:
  workflow_call:
    inputs:
      tag:
        description: "Git tag (for example v0.1.2)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag for a manual test (e.g. 0.4.1-rc.1). Blank → short SHA. Never moves :latest."
        required: false
        type: string

concurrency:
  group: docker-images-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # The blocking checks — the SAME reusable gate release.yml uses (Go suite + SDK unit + real E2E). `merge`
  # depends on it, so a red test can never become a pullable image tag (workflows aren't ordered; `needs:`
  # is the only gate). Gated on the manual path too: dispatch never moves :latest, but it does publish a
  # pullable tag, so it must clear the same bar.
  gate:
    name: Release gate
    uses: ./.github/workflows/release-gate.yml

  prepare:
    name: Resolve image tags
    needs: gate
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tags.outputs.tag }}
      minor: ${{ steps.tags.outputs.minor }}
      latest: ${{ steps.tags.outputs.latest }}
    steps:
      - id: tags
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.event.inputs.tag }}
          CALLED_FROM_RELEASE: ${{ github.event_name == 'workflow_call' }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG#v}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_SHA::7}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "minor=" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Image tag must be semver (got '$tag')."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "minor=" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "minor=$(cut -d. -f1-2 <<< "$tag")" >> "$GITHUB_OUTPUT"
            echo "latest=$CALLED_FROM_RELEASE" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    needs: [gate, prepare]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mindwire-runtime
            dockerfile: packages/docker/runtime.Dockerfile
            platform: amd64
            runner: ubuntu-24.04
          - image: mindwire-runtime
            dockerfile: packages/docker/runtime.Dockerfile
            platform: arm64
            runner: ubuntu-24.04-arm
          - image: mindwire-console
            dockerfile: packages/docker/console.Dockerfile
            platform: amd64
            runner: ubuntu-24.04
          - image: mindwire-console
            dockerfile: packages/docker/console.Dockerfile
            platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}

      # Push by digest under no tag — `merge` turns these into the tagged manifest list. A failure here
      # leaves nothing referenced in the registry.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.image }} (manifest)
    # `gate` as well as `build`: this job is where the image becomes PULLABLE (the per-arch builds push by
    # digest only), so it is the point a failing test has to stop.
    needs: [gate, prepare, build]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [mindwire-runtime, mindwire-console]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are resolved in a shell step above: reusable-workflow inputs are normalized before they
      # reach metadata-action, avoiding its empty-tag failure on a called workflow.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=${{ needs.prepare.outputs.minor }},enable=${{ needs.prepare.outputs.minor != '' }}
          flavor: |
            latest=${{ needs.prepare.outputs.latest }}

      - name: Create manifest list + push
        working-directory: /tmp/digests
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
          SRC: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$METADATA_JSON") \
            $(printf "${SRC}@sha256:%s " *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}" || true
