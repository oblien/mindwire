name: Release

# Tag-driven release. Push a tag `vX.Y.Z` (where X.Y.Z == packages/sdk/package.json version) and this:
#   1. runs the release gate (Go suite + SDK unit + real E2E) — a red gate blocks everything below;
#   2. builds the daemon as static Linux binaries (amd64 + arm64) and attaches them to a GitHub Release;
#   3. publishes to npm — the 5 per-platform `mindwire-daemon-*` packages FIRST, then `mindwire`.
#
# npm is the one IMMUTABLE artifact, so it publishes LAST and every publish is idempotent (skip a
# version already on the registry). A partial failure can then be re-run under the SAME tag without a
# version bump. `workflow_dispatch` re-publishes npm for the current version only (no GitHub release).
#
# Prerequisite secret: NPM_TOKEN (an npm automation token with publish rights). Absent it, the build +
# packaged-install smoke still run (a useful dry run), but the actual `npm publish` steps skip cleanly.
#
# Two version numbers, decoupled by design: the SDK's package.json version drives npm and stamps the
# `mindwire-daemon-*` packages (the tag is checked against it); the daemon binary's agent.Version
# (daemon/internal/agent/agent.go) is the sandbox "latest" channel's own version. Keep them aligned when
# the daemon changes — that's a documented manual step, not enforced here.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The blocking checks. `publish-release` and `publish-npm` depend on this, so a red test stops the
  # release rather than publishing alongside it (workflows aren't ordered — `needs:` is the only gate).
  gate:
    name: Release gate
    uses: ./.github/workflows/release-gate.yml

  build-daemon:
    name: Build daemon binaries (linux amd64 + arm64)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.mod
      # build.sh's default PLATFORMS is exactly linux/amd64 linux/arm64. Static (CGO-off) Go, so one
      # binary per arch runs on every Linux distro (glibc, musl, alpine) — no per-distro matrix needed.
      - name: Build
        working-directory: daemon
        run: PLATFORMS="linux/amd64 linux/arm64" ./build.sh
      - name: Stage + checksum release assets
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          for arch in amd64 arm64; do
            cp "daemon/dist/latest/mindwired-linux-${arch}" "dist/mindwired-${TAG}-linux-${arch}"
          done
          cp daemon/dist/latest/catalog.json dist/catalog.json
          cd dist
          : > checksums.txt
          for f in mindwired-${TAG}-linux-*; do
            sha256sum "$f" >> checksums.txt
            sha256sum "$f" > "$f.sha256"
          done
          echo "staged:"; ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [gate, build-daemon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: daemon-release
          path: dist
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          if [[ "${TAG}" == *-* ]]; then PRERELEASE_FLAG="--prerelease"; fi
          ASSETS=(
            "dist/mindwired-${TAG}-linux-amd64"
            "dist/mindwired-${TAG}-linux-amd64.sha256"
            "dist/mindwired-${TAG}-linux-arm64"
            "dist/mindwired-${TAG}-linux-arm64.sha256"
            "dist/catalog.json"
            "dist/checksums.txt"
          )
          # Idempotent: on a re-run the release exists and `gh release create` would fail — re-upload
          # with --clobber instead, so a partial failure can be re-published for the SAME tag.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} exists — re-uploading assets (--clobber)."
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            gh release create "${TAG}" \
              --title "mindwire ${TAG}" \
              --notes-from-tag \
              ${PRERELEASE_FLAG} \
              "${ASSETS[@]}"
          fi

  publish-npm:
    name: Publish to npm (daemon packages + SDK)
    needs: [gate, publish-release]
    # npm is immutable, so it goes LAST — only after the gate and the GitHub release succeed, so a
    # partial failure re-runs under the SAME version. `always()` keeps the manual npm-only path working:
    # on workflow_dispatch `publish-release` is skipped (push-only), and we publish anyway; on a tag push
    # we require it to have succeeded. `gate` is required on BOTH paths (no escape hatch).
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.publish-release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install
        run: bun install --frozen-lockfile

      # The tag IS the source of truth for the npm version — refuse a mismatch rather than publish a
      # version the tag doesn't name. Skipped on dispatch (no tag: dispatch re-publishes current version).
      - name: Verify tag matches SDK version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/sdk/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match packages/sdk/package.json version $PKG"; exit 1
          fi

      # Cross-compiles all 5 mindwire-daemon-* packages into packages/sdk/npm/* AND rewrites
      # optionalDependencies in packages/sdk/package.json in lockstep (MINDWIRE_RELEASE=1). Needs Go.
      - name: Build daemon packages (release)
        env:
          MINDWIRE_RELEASE: '1'
        run: bun --filter='mindwire' run build:daemon

      - name: Build SDK (dist)
        run: bun --filter='mindwire' run build

      # The real "does the published artifact install and run" check, BEFORE the immutable publish: pack
      # the SDK + the host-matching daemon package, install both tarballs into a temp project, then spawn
      # the daemon through the SDK's public API and hit /healthz + /catalog. If the packaged shape can't
      # install or boot, the release fails here under the SAME version instead of shipping. The script
      # (also runnable locally: `bash scripts/release-smoke.sh`) auto-detects the host platform — on this
      # linux runner that's linux-x64 — and prints ✓/✗ per step, exiting non-zero on any failure.
      - name: Packaged-install smoke
        run: bash scripts/release-smoke.sh

      - name: Check for npm token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN is not set — build + smoke ran, but npm publish is skipped (dry run)."
          fi

      # Daemon packages FIRST: `mindwire`'s optionalDependencies must already resolve on the registry
      # when it publishes. Idempotent per package (skip a name@version already on npm). Prerelease
      # tags (v1.2.3-rc.1) publish to the `next` dist-tag, not `latest`.
      - name: Publish daemon packages
        if: steps.token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NPM_TAG=""
          if [[ "${TAG}" == *-* ]]; then NPM_TAG="--tag next"; fi
          for d in packages/sdk/npm/mindwire-daemon-*; do
            name="$(node -p "require('./$d/package.json').name")"
            version="$(node -p "require('./$d/package.json').version")"
            if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
              echo "::notice::$name@$version already on npm — skipping."
              continue
            fi
            echo "publishing $name@$version"
            npm publish "$d" --access public --provenance ${NPM_TAG}
          done

      - name: Publish mindwire
        if: steps.token.outputs.present == 'true'
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NPM_TAG=""
          if [[ "${TAG}" == *-* ]]; then NPM_TAG="--tag next"; fi
          NAME="$(npm pkg get name | tr -d '"')"
          VERSION="$(npm pkg get version | tr -d '"')"
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" ]; then
            echo "::notice::$NAME@$VERSION already on npm — skipping publish (re-run of an existing release)."
            exit 0
          fi
          echo "publishing $NAME@$VERSION"
          npm publish --access public --provenance ${NPM_TAG}
