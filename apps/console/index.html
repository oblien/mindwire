<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Set the theme class before first paint so there's no flash. Light matches the website by default; the toggle in the nav persists the choice to localStorage under "mw-theme". -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("mw-theme");
          if (t !== "light" && t !== "dark") t = "light";
          document.documentElement.classList.toggle("dark", t === "dark");
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <title>Mindwire Console</title>
    <meta
      name="description"
      content="Your personal Mindwire workspace. Manage your account, connected devices, Cloud Computers and subscriptions."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
